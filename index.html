<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pac-Cover</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        overscroll-behavior: none;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: monospace;
        touch-action: manipulation;
      }
      .game-container {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        align-items: center;
        position: relative;
      }
      .game-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        flex-shrink: 0;
      }
      .ui-bar {
        display: flex;
        justify-content: space-between;
        width: 560px;
        padding: 4px 0;
        color: #fff;
        font-size: 14px;
      }
      .status {
        color: #fff;
        font-size: 14px;
        padding: 4px 0;
        min-height: 22px;
      }
      canvas {
        border: 2px solid #333;
        image-rendering: pixelated;
        display: block;
      }
      .joystick-area {
        display: none;
        flex: 1;
        width: 100%;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        align-items: center;
        justify-content: center;
        min-height: 0;
        flex-direction: column;
        gap: 10px;
      }
      .gesture-area {
        width: 70%;
        height: calc(100% - 60px);
        margin-bottom: 60px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #666;
        font-size: 16px;
        letter-spacing: 1px;
        text-transform: uppercase;
        text-align: center;
        gap: 6px;
      }
      .gesture-area.hidden,
      .joy-grid.hidden {
        display: none;
      }
      .joy-grid {
        display: grid;
        grid-template-columns: 80px 80px 80px;
        grid-template-rows: 80px 80px 80px;
        gap: 4px;
      }
      .joy-btn {
        width: 80px;
        height: 80px;
        background: rgba(255,255,255,0.08);
        border: 2px solid rgba(255,255,255,0.25);
        border-radius: 14px;
        color: rgba(255,255,255,0.7);
        font-size: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: background 0.08s, border-color 0.08s;
      }
      .joy-btn:active, .joy-btn.active {
        background: rgba(255,255,255,0.25);
        border-color: rgba(255,255,255,0.55);
        color: #fff;
      }
      .joy-up    { grid-column: 2; grid-row: 1; }
      .joy-left  { grid-column: 1; grid-row: 2; }
      .joy-down  { grid-column: 2; grid-row: 2; }
      .joy-right { grid-column: 3; grid-row: 2; }
      .switch-container {
        display: none;
        align-items: center;
        gap: 10px;
        color: #aaa;
        font-size: 13px;
        font-family: monospace;
        user-select: none;
        -webkit-user-select: none;
      }
      .switch {
        position: relative;
        display: inline-block;
        width: 48px;
        height: 26px;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(255,255,255,0.12);
        border-radius: 26px;
        transition: background 0.2s;
      }
      .slider:before {
        position: absolute;
        content: "";
        height: 20px;
        width: 20px;
        left: 3px;
        bottom: 3px;
        background: #666;
        border-radius: 50%;
        transition: transform 0.2s, background 0.2s;
      }
      .switch input:checked + .slider {
        background: rgba(255,255,255,0.25);
      }
      .switch input:checked + .slider:before {
        transform: translateX(22px);
        background: #ff0;
      }

      @media (max-width: 800px) and (pointer: coarse) {
        .game-container {
          height: 100vh;
        }
        .game-area {
          height: 65vh;
          justify-content: center;
        }
        .joystick-area {
          display: flex;
          height: 35vh;
          flex: none;
        }
        .switch-container {
          display: flex;
          position: absolute;
          right: 16px;
          bottom: 35vh;
          z-index: 10;
        }
        .ui-bar {
          width: calc(100% - 20px);
          max-width: 560px;
          padding: 2px 10px;
          font-size: 11px;
        }
        canvas {
          max-height: calc(65vh - 56px);
          max-width: calc(100vw - 8px);
        }
        .status {
          font-size: 11px;
        }
        canvas {
          max-height: calc(65vh - 56px);
          max-width: calc(100vw - 8px);
        }
      }
    </style>
  </head>
  <body>
    <div class="game-container">
      <div class="game-area">
        <div class="ui-bar">
          <span>SCORE: <span id="score">0</span></span>
          <span>LEVEL: <span id="level">1</span></span>
        </div>
        <canvas id="game-canvas" width="560" height="620"></canvas>
        <div class="ui-bar">
          <span>LIVES: <span id="lives">2</span></span>
          <span class="status" id="status"></span>
        </div>
      </div>
      <label class="switch-container" id="switch-container">
        <span>botões</span>
        <label class="switch">
          <input type="checkbox" id="control-toggle">
          <span class="slider"></span>
        </label>
        <span>gestos</span>
      </label>
      <div class="joystick-area" id="joystick-area">
        <div class="joy-grid" id="joy-grid">
          <button class="joy-btn joy-up"    data-dir="up">▲</button>
          <button class="joy-btn joy-left"  data-dir="left">◀</button>
          <button class="joy-btn joy-down"  data-dir="down">▼</button>
          <button class="joy-btn joy-right" data-dir="right">▶</button>
        </div>
        <div class="gesture-area hidden" id="gesture-area"><span>área de gestos</span><span>ARRASTE E SOLTE</span></div>
      </div>
    </div>
    <script src="src/constants.js?v=4"></script>
    <script src="src/map.js?v=4"></script>
    <script src="src/audio.js?v=4"></script>
    <script src="src/game.js?v=4"></script>
  </body>
</html>
