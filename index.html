<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pac-Man</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        overscroll-behavior: none;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: monospace;
        touch-action: manipulation;
      }
      .game-container {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        align-items: center;
      }
      .game-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        flex-shrink: 0;
      }
      .ui-bar {
        display: flex;
        justify-content: space-between;
        width: 560px;
        padding: 4px 0;
        color: #fff;
        font-size: 14px;
      }
      .status {
        color: #fff;
        font-size: 14px;
        padding: 4px 0;
        min-height: 22px;
      }
      canvas {
        border: 2px solid #333;
        image-rendering: pixelated;
        display: block;
      }
      .joystick-area {
        display: none;
        flex: 1;
        width: 100%;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        align-items: center;
        justify-content: center;
        min-height: 0;
      }
      .gesture-area {
        width: 70%;
        height: calc(100% - 60px);
        margin-bottom: 60px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #666;
        font-size: 16px;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      @media (max-width: 800px) and (pointer: coarse) {
        .game-container {
          height: 100vh;
        }
        .game-area {
          height: 65vh;
          justify-content: center;
        }
        .joystick-area {
          display: flex;
          height: 35vh;
          flex: none;
        }
        .ui-bar {
          width: calc(100% - 20px);
          max-width: 560px;
          padding: 2px 10px;
          font-size: 11px;
        }
        canvas {
          max-height: calc(65vh - 56px);
          max-width: calc(100vw - 8px);
        }
        .status {
          font-size: 11px;
        }
        canvas {
          max-height: calc(65vh - 56px);
          max-width: calc(100vw - 8px);
        }
      }
    </style>
  </head>
  <body>
    <div class="game-container">
      <div class="game-area">
        <div class="ui-bar">
          <span>SCORE: <span id="score">0</span></span>
          <span>LEVEL: <span id="level">1</span></span>
        </div>
        <canvas id="game-canvas" width="560" height="620"></canvas>
        <div class="ui-bar">
          <span>LIVES: <span id="lives">2</span></span>
          <span class="status" id="status"></span>
        </div>
      </div>
      <div class="joystick-area" id="joystick-area">
        <div class="gesture-area" id="gesture-area">área de gestos</div>
      </div>
    </div>
    <script src="src/constants.js"></script>
    <script src="src/map.js"></script>
    <script src="src/audio.js"></script>
    <script src="src/game.js"></script>
  </body>
</html>
